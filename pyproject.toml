[project]
name = "telegram-notify"
version = "0.1.0"
description = "One-shot Telegram notifications for coding agents: a dependency-free CLI, an MCP server and a Claude Code skill, with message guidelines."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.2"]

[project.scripts]
telegram-notify = "telegram_notify.cli:main"
telegram-notify-setup = "telegram_notify.setup:main"
telegram-notify-mcp = "telegram_notify.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["telegram_notify"]
